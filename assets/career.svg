<text class="m" x="416" y="222" font-size="13" fill="#66768d" text-anchor="middle">2023</text><line x1="600" y1="192" x2="600" y2="200" stroke="#26364f"/>
<text class="m" x="600" y="222" font-size="13" fill="#66768d" text-anchor="middle">2024</text><line x1="784" y1="192" x2="784" y2="200" stroke="#26364f"/>
