<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-labelledby="title desc">
<title id="title">Career timeline</title>
<desc id="desc">Onlio, React and QA, 2021. Fortuna Entertainment Group, marketing technology, 2022 to 2023. Partners Banka, mobile with React Native, 2023 to 2025. Piletilevi PLG, React Native developer 2025 to 2026, then Senior Full-Stack Developer from June 2026.</desc>
<style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}

.seg{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lab{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out 1.6s infinite both}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1322"/><stop offset="1" stop-color="#060a12"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1d2b44"/></pattern>
<radialGradient id="dotfade" cx=".85" cy=".1" r="1"><stop offset="0" stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="dotmask"><rect width="1200" height="244" fill="url(#dotfade)"/></mask>
<radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="244" rx="20"/></clipPath><linearGradient id="now" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7df0ff"/></linearGradient></defs>
<g clip-path="url(#card)">
<rect width="1200" height="244" fill="url(#bg)"/>
<rect width="1200" height="244" fill="url(#dots)" mask="url(#dotmask)"/>

</g>
<rect x=".5" y=".5" width="1199" height="243" rx="19.5" fill="none" stroke="#1a2740"/>
<line x1="1" y1="56" x2="1199" y2="56" stroke="#1a2740"/>
<path d="M24 57 V28 a12 12 0 0 1 12 -12 H170 a12 12 0 0 1 12 12 V57 Z" fill="#0f1a2e" stroke="#1a2740"/>
<rect x="25" y="55" width="156" height="3" fill="#0f1a2e"/>
