<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="316" viewBox="0 0 1200 316" role="img" aria-labelledby="title desc">
<title id="title">How I work with AI coding agents</title>
<desc id="desc">Specify, map the system, decompose, delegate to agents, review and debug in a loop, then validate and integrate.</desc>
<style>
