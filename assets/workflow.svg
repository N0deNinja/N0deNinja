@keyframes n0{0%{opacity:0}0%{opacity:0}1.5%{opacity:1}10%{opacity:1}11.5%{opacity:0}100%{opacity:0}}.n0{animation:n0 10s linear infinite}@keyframes n1{0%{opacity:0}11%{opacity:0}12.5%{opacity:1}21%{opacity:1}22.5%{opacity:0}100%{opacity:0}}.n1{animation:n1 10s linear infinite}@keyframes n2{0%{opacity:0}22%{opacity:0}23.5%{opacity:1}32%{opacity:1}33.5%{opacity:0}100%{opacity:0}}.n2{animation:n2 10s linear infinite}@keyframes n3{0%{opacity:0}33%{opacity:0}34.5%{opacity:1}43%{opacity:1}44.5%{opacity:0}63%{opacity:0}64.5%{opacity:1}71%{opacity:1}72.5%{opacity:0}100%{opacity:0}}.n3{animation:n3 10s linear infinite}@keyframes n4{0%{opacity:0}44%{opacity:0}45.5%{opacity:1}54%{opacity:1}55.5%{opacity:0}72%{opacity:0}73.5%{opacity:1}80%{opacity:1}81.5%{opacity:0}100%{opacity:0}}.n4{animation:n4 10s linear infinite}@keyframes n5{0%{opacity:0}81%{opacity:0}82.5%{opacity:1}93%{opacity:1}94.5%{opacity:0}100%{opacity:0}}.n5{animation:n5 10s linear infinite}
.hl{opacity:0}
.loop{opacity:0;animation:loop 10s linear infinite,flow 1s linear infinite}
@keyframes loop{0%,54%{opacity:0}56%,63%{opacity:1}65%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
